<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para a minha Princesinha 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background-color: #1a0a0f;
    background-image:
      radial-gradient(ellipse at 20% 20%, #3d1020 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, #2a0a1a 0%, transparent 50%);
    font-family: 'Lato', sans-serif;
    color: #f5e6ec;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    text-align: center;
  }
  .petals {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .petal {
    position: absolute;
    top: -40px;
    opacity: 0;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { opacity: 0; transform: translateY(0) rotate(0deg); }
    10%  { opacity: 0.7; }
    90%  { opacity: 0.5; }
    100% { opacity: 0; transform: translateY(105vh) rotate(360deg); }
  }
  .content {
    position: relative;
    z-index: 1;
    max-width: 420px;
  }
  .coracao {
    font-size: 48px;
    display: block;
    margin-bottom: 1.5rem;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 400;
    color: #f0d4de;
    margin-bottom: 0.5rem;
    line-height: 1.4;
  }
  h1 span {
    font-style: italic;
    color: #e8a0b0;
  }
  p {
    font-size: 15px;
    font-weight: 300;
    color: #c8a0b0;
    line-height: 1.8;
    margin-top: 1.25rem;
  }
  .hint {
    margin-top: 2.5rem;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(200, 100, 130, 0.5);
  }
</style>
</head>
<body>
<div class="petals" id="petals"></div>
<div class="content">
  <span class="coracao">♥</span>
  <h1>Para a minha<br><span>Princesinha Lilian</span></h1>
  <p>Espalhei pela nossa casa 8 QR codes especiais.<br>Cada um guarda uma memória nossa.</p>
  <p>Procure-os com carinho — assim como eu te encontrei.</p>
  <p class="hint">com todo meu amor ✦</p>
</div>
<script>
  const emojis = ['🌹','✨','💕','🌸','💖'];
  const petals = document.getElementById('petals');
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('span');
    p.className = 'petal';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (6 + Math.random() * 8) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    p.style.fontSize = (14 + Math.random() * 10) + 'px';
    petals.appendChild(p);
  }
</script>
</body>
</html>
